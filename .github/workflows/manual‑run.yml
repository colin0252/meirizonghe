name: 手动执行任务（节点处理+回写仓库）
on:
  workflow_dispatch:
    inputs:
      run_args:
        description: "运行参数（可选）"
        required: false
        default: ""

jobs:
  execute:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库全部代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 打印环境信息
        run: |
          echo "===== 手动任务启动 ====="
          echo "传入参数: ${{ github.event.inputs.run_args }}"
          date
          ls -la nodes/

      - name: 配置Python3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 如果你不需要第三方库，把下面这一整块【安装依赖】删掉！
      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行脚本，读取nodes，输出到output文件夹
        run: |
          python main.py ${{ github.event.inputs.run_args }}

      - name: 提交处理后的output文件回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "【自动】节点处理完成，更新output"
          git push