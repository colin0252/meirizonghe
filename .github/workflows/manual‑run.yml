name: 每日汇总
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all # 这里直接给job写权限，不用网页设置
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成原始节点文件
        run: |
          TODAY=$(date +%Y-%m-%d)
          # ==========粘贴你原来抓取节点输出 output/${TODAY}-1.txt 的全部脚本==========

      - name: 转base64生成小火箭订阅文件
        run: |
          TODAY=$(date +%Y-%m-%d)
          base64 -w 0 output/${TODAY}-1.txt > output/sub.txt

      - name: 提交更新sub.txt到仓库
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sub.txt
          git commit -m "update sub.txt $TODAY"
          git push