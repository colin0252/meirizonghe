name: 每日汇总
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成原始节点文件（这里放你原来抓取、输出txt的全部代码，不要删）
        run: |
          TODAY=$(date +%Y-%m-%d)
          # ==========下面是你原本的脚本，复制粘贴过来==========
          # 你的原有逻辑：输出 output/${TODAY}-1.txt
          # ==================================================

      - name: 转base64生成小火箭订阅文件【新增这一步】
        run: |
          TODAY=$(date +%Y-%m-%d)
          base64 -w 0 output/${TODAY}-1.txt > output/sub.txt

      - name: 提交更新sub.txt到仓库
        run: |
          TODAY=$(date +%Y-%m-%d)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/sub.txt
          git commit -m "update sub.txt $TODAY"
          git push